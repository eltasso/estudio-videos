name: llave
run-name: "Llevar claves cifradas al panel"

on:
  workflow_dispatch:
    inputs:
      llave:  { description: "candado público que generó el navegador", required: true }
      pedido: { description: "id del pedido", required: true }

permissions:
  contents: write

jobs:
  llave:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Herramienta de cifrado
        run: pip install -q "cryptography==43.0.3"
      - name: Cifrar para ese navegador
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLAVE: ${{ inputs.llave }}
          PEDIDO: ${{ inputs.pedido }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -u motor/llave.py
